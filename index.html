<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moja Random Stranica</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      transition: 0.3s;
    }

    header {
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      padding: 20px;
      text-align: center;
      color: white;
    }

    .container {
      padding: 30px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #4facfe;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background: #0077ff;
    }

    .box {
      margin: 20px auto;
      width: 200px;
      height: 200px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .dark {
      background: #121212;
      color: white;
    }

    .dark .box {
      background: #1e1e1e;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 Moja Random Web Stranica</h1>
  </header>

  <div class="container">
    <p>Klikni gumb i nešto će se promijeniti 😄</p>

    <div class="box" id="box">HELLO</div>

    <button onclick="changeText()">Promijeni tekst</button>
    <button onclick="toggleDark()">Dark mode</button>
  </div>

  <script>
    function changeText() {
      const texts = ["HELLO", "WOW 😎", "RANDOM", "KLIK!", "WEB FUN"];
      const box = document.getElementById("box");
      box.innerText = texts[Math.floor(Math.random() * texts.length)];
    }

    function toggleDark() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
