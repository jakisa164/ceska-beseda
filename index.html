<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Stranica</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:linear-gradient(135deg,#1e3c72,#2a5298);
        color:white;
        overflow-x:hidden;
    }

    header{
        text-align:center;
        padding:40px;
        background:rgba(0,0,0,0.3);
        backdrop-filter:blur(5px);
    }

    header h1{
        font-size:50px;
        margin:0;
    }

    header p{
        font-size:20px;
        opacity:0.8;
    }

    .container{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
        padding:30px;
    }

    .card{
        background:rgba(255,255,255,0.1);
        border-radius:20px;
        padding:20px;
        transition:0.3s;
        backdrop-filter:blur(8px);
        box-shadow:0 5px 15px rgba(0,0,0,0.3);
    }

    .card:hover{
        transform:translateY(-10px) scale(1.03);
    }

    .card h2{
        margin-top:0;
    }

    button{
        padding:12px 25px;
        border:none;
        border-radius:10px;
        background:#00c6ff;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#0072ff;
    }

    .random-box{
        text-align:center;
        padding:40px;
    }

    footer{
        text-align:center;
        padding:20px;
        background:rgba(0,0,0,0.3);
        margin-top:20px;
    }
</style>
</head>

<body>

<header>
    <h1>🔥 Random Web Stranica 🔥</h1>
    <p>Napravljena samo iz dosade 😎</p>
</header>

<div class="container">

    <div class="card">
        <h2>🎮 Gaming</h2>
        <p>Ovdje možeš staviti nešto o igricama, Robloxu ili Minecraftu.</p>
        <button onclick="alert('Gaming sekcija!')">Klikni</button>
    </div>

    <div class="card">
        <h2>🐦 Papige</h2>
        <p>Dodaj slike svojih papiga i informacije o njima.</p>
        <button onclick="alert('Papige su zakon!')">Klikni</button>
    </div>

    <div class="card">
        <h2>💻 Programiranje</h2>
        <p>Možeš učiti HTML, CSS i JavaScript.</p>
        <button onclick="alert('Kodiranjeee!')">Klikni</button>
    </div>

</div>

<div class="random-box">
    <h2>🎲 Random broj:</h2>
    <h1 id="broj">0</h1>
    <button onclick="randomBroj()">Generiraj</button>
</div>

<footer>
    © 2026 Random Stranica
</footer>

<script>
function randomBroj(){
    let broj = Math.floor(Math.random()*1000);
    document.getElementById("broj").innerText = broj;
}
</script>

</body>
</html>
