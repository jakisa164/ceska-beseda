<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Čaglin</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    color:#222;
}

/* HEADER */

header{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

header h1{
    font-size:70px;
}

header p{
    font-size:22px;
}

/* SEKCIJE */

section{
    padding:60px 10%;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    margin-top:20px;
}

h2{
    color:#00695c;
}

/* MAPA */

iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:15px;
}

/* FOOTER */

footer{
    background:#00695c;
    color:white;
    text-align:center;
    padding:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#00695c;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#004d40;
}

</style>
</head>

<body>

<header>

<div>
    <h1>ČAGLIN</h1>

    <p>
        Malo mjesto u Slavoniji poznato po prirodi i mirnom životu.
    </p>

    <button onclick="pozdrav()">
        Klikni
    </button>
</div>

</header>

<section>

<div class="card">

    <h2>O Čaglinu</h2>

    <p>
        Čaglin se nalazi u Požeško-slavonskoj županiji.
        Okružen je prirodom, šumama i slavonskim krajolikom.
        Mjesto je poznato po mirnom okruženju i gostoljubivim ljudima.
    </p>

</div>

<div class="card">

    <h2>Lokacija</h2>

    <iframe
    src="https://maps.google.com/maps?q=Čaglin&t=&z=13&ie=UTF8&iwloc=&output=embed">
    </iframe>

</div>

</section>

<footer>
    Web stranicu izradio učenik 🙂
</footer>

<script>

function pozdrav(){
    alert("Dobrodošli u Čaglin!");
}

</script>

</body>
</html>
